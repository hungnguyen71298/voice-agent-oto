services:
  voice-agent:
    build: .
    env_file: .env
    # Mic and speaker need the host's audio devices. Linux hosts only; on Windows and
    # macOS Docker cannot forward audio, so run directly in a venv instead.
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    stdin_open: true
    tty: true
